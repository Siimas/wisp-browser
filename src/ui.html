<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
/* Sizes here must match App::bar_size and STRIP in main.rs. */
:root {
  --bg: #ececf0; --fg: #1d1d1f; --mute: #57575d;
  --surface: #ffffffb8; --field: #0000000f; --line: #00000018; --hover: #0000000f;
  --accent: #6c8cff; --radius: 8px; --font: 13px;
  --tabs-h: 40px; --bar-h: 44px; --side-w: 260px;
  --paint: var(--bg); --tex: none; --tex-op: 0; --tex-blend: normal;
  color-scheme: light;
}
:root[data-theme=dark] {
  --bg: #1b1b1f; --fg: #f2f2f4; --mute: #a3a3ab;
  --surface: #ffffff17; --field: #00000040; --line: #ffffff1c; --hover: #ffffff14;
  color-scheme: dark;
}
:root[data-mode=top-compact] { --tabs-h: 32px; --bar-h: 36px; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; display: flex; flex-direction: column; overflow: hidden;
  background: var(--paint); color: var(--fg);
  font: var(--font) system-ui, -apple-system, "Segoe UI", sans-serif;
  user-select: none; -webkit-user-select: none; cursor: default;
}
body::before { /* texture layer */
  content: ""; position: fixed; inset: 0; pointer-events: none;
  background: var(--tex); opacity: var(--tex-op); mix-blend-mode: var(--tex-blend);
}
:root[data-side=left] body { flex-direction: row; }
:root[data-side=right] body { flex-direction: row-reverse; }
button { font: inherit; color: inherit; border: 0; background: none; border-radius: var(--radius); padding: 0; }
button:hover { background: var(--hover); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.4; vertical-align: middle; }

/* ---------- the bar: shared pieces ---------- */
#chrome { flex: none; position: relative; min-width: 0; }
#nav, #actions, #ws { display: flex; align-items: center; gap: 2px; min-width: 0; }
#nav button, #actions button { flex: none; width: 30px; height: 28px; font-size: 16px; }
#badge { display: none; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--fg); color: var(--bg); margin-left: 6px; }
:root[data-private] #badge { display: inline-block; }
#url {
  min-width: 0; padding: 0 12px; border: 1px solid transparent; border-radius: var(--radius);
  background: var(--field); color: var(--fg); font: inherit; outline: none;
}
#url:focus { border-color: var(--accent); }
#shield { opacity: .4; }
#shield.on { opacity: 1; color: var(--accent); }
.spacer { flex: 1; align-self: stretch; }

.ws {
  flex: none; display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 6px;
  border-radius: 99px; max-width: 140px; color: var(--mute);
}
.ws i { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.ws span { display: none; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.ws.active { background: var(--surface); color: var(--fg); }
.ws.active span { display: block; }
#ws-add { flex: none; width: 24px; height: 24px; color: var(--mute); font-size: 15px; line-height: 1; }
#ws-name { display: none; width: 110px; height: 24px; padding: 0 8px; border: 1px solid var(--accent); border-radius: 99px; background: var(--field); color: var(--fg); font: inherit; }
#ws.adding #ws-name { display: block; }
#ws.adding #ws-add { display: none; }
:root[data-private] #ws { visibility: hidden; }

#tabs { display: flex; gap: 2px; min-width: 0; min-height: 0; }
.tab {
  display: flex; align-items: center; gap: 4px; min-width: 0; padding: 0 6px 0 12px;
  border-radius: var(--radius); color: var(--mute);
}
.tab:hover { background: var(--hover); }
.tab.active { background: var(--surface); color: var(--fg); }
.tab.private span { font-style: italic; }
.tab.private span::before { content: "\25D1  "; font-style: normal; color: var(--accent); }
.tab span { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tab button { flex: none; width: 20px; height: 20px; line-height: 1; opacity: .6; }
.tab button:hover { opacity: 1; }
#new { flex: none; color: var(--mute); }

#progress { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; overflow: hidden; display: none; }
#progress.on { display: block; }
#progress::after { content: ""; position: absolute; height: 100%; width: 30%; background: var(--accent); animation: load 1s linear infinite; }
@keyframes load { from { left: -30%; } to { left: 100%; } }
@media (prefers-reduced-motion: reduce) { #progress::after { animation: none; width: 100%; left: 0; } }

/* ---------- top bar ---------- */
:root[data-side=top] #chrome {
  display: flex; flex-wrap: wrap; align-items: center; align-content: flex-start;
  height: calc(var(--tabs-h) + var(--bar-h)); border-bottom: 1px solid var(--line);
  background: linear-gradient(transparent var(--tabs-h), var(--surface) var(--tabs-h));
}
/* Row 1: workspaces + tabs. Row 2: navigation, address, actions. */
:root[data-side=top] #ws { order: 1; height: var(--tabs-h); padding: 0 4px 0 8px; }
:root[data-side=top][data-lights] #ws { padding-left: 82px; }
:root[data-side=top] #tabs { order: 2; flex: 1; height: var(--tabs-h); align-items: flex-end; padding-right: 8px; }
:root[data-side=top] #chrome::after { content: ""; order: 3; flex-basis: 100%; }
:root[data-side=top] .tab { flex: 1 1 0; max-width: 220px; height: calc(var(--tabs-h) - 6px); border-radius: var(--radius) var(--radius) 0 0; }
:root[data-side=top] #new { width: 28px; height: 28px; margin: 0 0 3px 2px; font-size: 18px; line-height: 1; }
:root[data-side=top] #new span { display: none; }
:root[data-side=top] #nav { order: 4; height: calc(var(--bar-h) - 1px); padding-left: 8px; }
:root[data-side=top] #url { order: 5; flex: 1; height: calc(var(--bar-h) - 14px); margin: 0 6px; }
:root[data-side=top] #actions { order: 6; height: calc(var(--bar-h) - 1px); padding-right: 8px; }
:root[data-side=top] .spacer { display: none; }

/* ---------- sidebar ---------- */
:root:not([data-side=top]) #chrome {
  width: var(--side-w); display: flex; flex-direction: column; gap: 8px; padding: 8px;
}
:root[data-side=left] #chrome { border-right: 1px solid var(--line); }
:root[data-side=right] #chrome { border-left: 1px solid var(--line); }
:root[data-side=left][data-lights] #chrome { padding-top: 34px; }
:root:not([data-side=top]) #url { flex: none; height: 32px; }
:root:not([data-side=top]) #tabs { flex: 1; flex-direction: column; overflow-y: auto; }
:root:not([data-side=top]) .tab { flex: none; height: 34px; }
:root:not([data-side=top]) #new { height: 34px; text-align: left; padding: 0 12px; }
:root:not([data-side=top]) #new b { font-weight: normal; display: inline-block; width: 16px; }

/* ---------- collapsed: only a thin strip of this view is on screen ---------- */
:root[data-hidden] #chrome, :root[data-hidden] #settings { display: none; }
:root[data-hidden] body { cursor: pointer; }
:root[data-hidden] body::after { content: ""; position: fixed; inset: 0; background: var(--accent); opacity: .25; }
:root[data-hidden] body:hover::after { opacity: .7; }

/* ---------- settings ---------- */
#settings { display: none; flex: 1; min-width: 0; overflow-y: auto; padding: 24px 16px 64px; position: relative; }
:root[data-settings] #settings { display: block; }
#settings > div { max-width: 640px; margin: 0 auto; }
#settings h1 { font-size: 22px; margin: 0 0 4px; display: flex; justify-content: space-between; align-items: center; }
#settings h1 .btn { font-size: var(--font); font-weight: 500; }
#settings h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); margin: 28px 0 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 14px; min-height: 44px; }
.row + .row { border-top: 1px solid var(--line); }
.row.col { flex-direction: column; align-items: stretch; gap: 8px; }
.row small { display: block; color: var(--mute); margin-top: 2px; }
.row input[type=text], .row input[type=number], .row select, .row textarea, .row .key, .btn {
  font: inherit; color: var(--fg); background: var(--field); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 6px 10px;
}
.row input[type=text] { width: 300px; max-width: 55vw; }
.row input[type=number] { width: 80px; }
.row textarea { width: 100%; min-height: 90px; resize: vertical; font-family: ui-monospace, Menlo, Consolas, monospace; }
.row input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
.row input[type=range] { accent-color: var(--accent); width: 180px; }
.row input[type=color] { width: 40px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; }
.row .key { min-width: 150px; text-align: center; }
.row .key.rec { border-color: var(--accent); color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.modes button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border: 1px solid var(--line); }
.modes button.on { border-color: var(--accent); background: var(--hover); }
.modes .pic { width: 56px; height: 38px; border: 1.5px solid currentColor; border-radius: 5px; position: relative; opacity: .8; }
.modes .pic::after { content: ""; position: absolute; background: currentColor; opacity: .55; }
.pic.sr::after { top: 0; bottom: 0; right: 0; width: 30%; }
.pic.sl::after { top: 0; bottom: 0; left: 0; width: 30%; }
.pic.tr::after { left: 0; right: 0; top: 0; height: 38%; }
.pic.tc::after { left: 0; right: 0; top: 0; height: 24%; }

.preset { width: 54px; height: 36px; border: 1px solid var(--line); border-radius: var(--radius); }
.preset:hover { outline: 2px solid var(--accent); }
.swatch { position: relative; }
.swatch button { position: absolute; top: -7px; right: -7px; width: 16px; height: 16px; border-radius: 50%; background: var(--fg); color: var(--bg); font-size: 11px; line-height: 1; }
.wsrow { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.wsrow input[type=text] { flex: 1; width: auto; min-width: 0; }
</style>
<style id="user-css"></style>
</head>
<body>
<div id="chrome">
  <div id="nav">
    <button data-act="back" title="Back" aria-label="Back">&#8249;</button>
    <button data-act="forward" title="Forward" aria-label="Forward">&#8250;</button>
    <button data-act="reload" title="Reload" aria-label="Reload">&#8635;</button>
    <button data-act="home" title="Home" aria-label="Home">&#8962;</button>
    <span id="badge">Private</span>
    <span class="spacer"></span>
    <button data-act="toggle_bar" id="collapse" title="Collapse" aria-label="Collapse or pin the bar">
      <svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path id="collapse-line" d="M10.5 2.5v11"/></svg>
    </button>
  </div>
  <input id="url" type="text" placeholder="Search or enter address" aria-label="Address" spellcheck="false" autocomplete="off">
  <div id="ws"></div>
  <div id="tabs"></div>
  <div id="actions">
    <button data-act="new_private_tab" title="New private tab" aria-label="New private tab">&#9681;</button>
    <button data-act="private_window" title="New private window" aria-label="New private window">
      <svg viewBox="0 0 16 16"><rect x="1.5" y="4.5" width="10" height="9" rx="1.5"/><path d="M4.5 4.5v-2h10v9h-3"/></svg>
    </button>
    <span class="spacer"></span>
    <button id="shield" title="Ad blocking" aria-label="Toggle ad blocking">&#9737;</button>
    <button data-act="settings" title="Settings" aria-label="Settings">&#9881;</button>
  </div>
  <div id="progress"></div>
</div>

<div id="settings"><div>
  <h1>Settings <button class="btn" data-act="settings">Done</button></h1>

  <h2>Layout</h2>
  <div class="card">
    <div class="row col">
      <div class="modes" id="modes">
        <button data-mode="sidebar-right"><span class="pic sr"></span>Sidebar right</button>
        <button data-mode="sidebar-left"><span class="pic sl"></span>Sidebar left</button>
        <button data-mode="top-relaxed"><span class="pic tr"></span>Top, relaxed</button>
        <button data-mode="top-compact"><span class="pic tc"></span>Top, compact</button>
      </div>
    </div>
    <label class="row"><span>Collapse the bar<small>Tucks it away to a thin strip at the window edge</small></span>
      <input type="checkbox" data-k="layout.collapsed"></label>
    <label class="row"><span>Show on hover<small>While collapsed, moving the mouse to that edge brings the bar back until you leave</small></span>
      <input type="checkbox" data-k="layout.hover_expand"></label>
    <label class="row">Sidebar width <input type="range" min="180" max="420" step="10" data-k="layout.sidebar_width"></label>
  </div>

  <h2>Workspaces</h2>
  <div class="card" id="ws-list"></div>
  <p><button class="btn" id="ws-new">Add workspace</button></p>

  <h2>Theme</h2>
  <div class="card">
    <div class="row col"><span>Presets</span><div class="chips" id="presets"></div></div>
    <div class="row"><span>Background colors<small>Up to three; two or more make a gradient</small></span>
      <div class="chips" id="bg-colors"></div></div>
    <label class="row">Gradient angle <input type="range" min="0" max="359" data-k="appearance.gradient_angle"></label>
    <label class="row">Texture
      <select data-k="appearance.texture">
        <option value="none">None</option><option value="grain">Grain</option><option value="dots">Dots</option>
        <option value="lines">Lines</option><option value="grid">Grid</option>
      </select></label>
    <label class="row">Texture strength <input type="range" min="0" max="100" data-k="appearance.texture_strength"></label>
    <label class="row">Accent color <input type="color" data-k="appearance.accent"></label>
    <label class="row"><span>Light or dark<small>Used for pages, and for the bar when no background color is set</small></span>
      <select data-k="appearance.theme">
        <option value="system">Match system</option><option value="light">Light</option><option value="dark">Dark</option>
      </select></label>
    <label class="row">Corner roundness <input type="range" min="0" max="20" data-k="appearance.radius"></label>
    <label class="row">Interface text size <input type="number" min="10" max="20" data-k="appearance.font_size"></label>
    <label class="row col"><span>Custom CSS<small>Restyle the bar yourself. Applies as you type.</small></span>
      <textarea data-k="appearance.custom_css" spellcheck="false" placeholder=".tab.active { box-shadow: inset 0 0 0 1px var(--accent); }"></textarea></label>
  </div>

  <h2>Behavior</h2>
  <div class="card">
    <label class="row">Homepage <input type="text" data-k="behavior.homepage"></label>
    <label class="row">New tab opens <input type="text" data-k="behavior.new_tab_url"></label>
    <label class="row"><span>Search engine<small>URL with %s where the search goes</small></span>
      <input type="text" data-k="behavior.search_url" list="engines"></label>
    <datalist id="engines">
      <option value="https://duckduckgo.com/?q=%s">DuckDuckGo</option>
      <option value="https://www.google.com/search?q=%s">Google</option>
      <option value="https://www.bing.com/search?q=%s">Bing</option>
      <option value="https://search.brave.com/search?q=%s">Brave</option>
      <option value="https://www.startpage.com/sp/search?query=%s">Startpage</option>
    </datalist>
    <label class="row">Reopen last session's tabs on start <input type="checkbox" data-k="behavior.restore_session"></label>
    <label class="row">Default page zoom <input type="number" min="0.3" max="4" step="0.1" data-k="behavior.default_zoom"></label>
  </div>

  <h2>Ad blocking</h2>
  <div class="card">
    <label class="row">Block ads and trackers <input type="checkbox" data-k="adblock.enabled"></label>
    <label class="row col"><span>Extra hosts to block<small>One per line, e.g. ads.example.com. Subdomains are included.</small></span>
      <textarea data-k="adblock.extra_hosts" spellcheck="false"></textarea></label>
  </div>

  <h2>Hotkeys</h2>
  <div class="card" id="hotkeys"></div>
  <p><button class="btn" id="reset-keys">Reset hotkeys to defaults</button></p>
</div></div>

<script>
const post = m => window.ipc.postMessage(JSON.stringify(m));
const $ = s => document.querySelector(s);
const root = document.documentElement;
const dark = matchMedia('(prefers-color-scheme: dark)');
const get = (o, k) => k.split('.').reduce((a, p) => a[p], o);
const set = (o, k, v) => { const ps = k.split('.'), last = ps.pop(); ps.reduce((a, p) => a[p], o)[last] = v; };
const save = () => post({ cmd: 'save_settings', config: cfg });
const act = name => post({ cmd: 'action', name });
const el = (tag, props, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };

let S = null, cfg = null, shown = null, hovering = false, leaveTimer = 0;

window.wisp = {
  state(s) { S = s; cfg = s.config; render(); },
  focusUrl() { $('#url').focus(); $('#url').select(); },
};

// ---------- look ----------
const GRAIN = `url("data:image/svg+xml,${encodeURIComponent(
  "<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(#n)'/></svg>")}")`;
const TEXTURES = {
  none: ['none', 0, 'normal'],
  grain: [GRAIN, 1, 'soft-light'],
  dots: ['radial-gradient(var(--fg) 1px, transparent 1.6px) 0 0 / 12px 12px', .3, 'normal'],
  lines: ['repeating-linear-gradient(135deg, var(--fg) 0 1px, transparent 1px 9px)', .25, 'normal'],
  grid: ['linear-gradient(var(--fg) 1px, transparent 1px) 0 0 / 18px 18px, linear-gradient(90deg, var(--fg) 1px, transparent 1px) 0 0 / 18px 18px', .2, 'normal'],
};
const PRESETS = [
  { name: 'Default', background: [], accent: '#6c8cff', texture: 'none', texture_strength: 30 },
  { name: 'Dusk', background: ['#2b2d6e', '#7a3b8f', '#e0728a'], accent: '#ffb3c1', texture: 'grain', texture_strength: 40 },
  { name: 'Forest', background: ['#0f3d3e', '#2f6f4f'], accent: '#8fd694', texture: 'grain', texture_strength: 35 },
  { name: 'Ocean', background: ['#0b2545', '#13629a'], accent: '#7fd1ff', texture: 'lines', texture_strength: 25 },
  { name: 'Sand', background: ['#f4e7d3', '#e8c9a0'], accent: '#a4551a', texture: 'dots', texture_strength: 30 },
  { name: 'Rose', background: ['#ffe3ec', '#ffc2d4'], accent: '#c2255c', texture: 'none', texture_strength: 30 },
  { name: 'Mono', background: ['#18181b'], accent: '#a1a1aa', texture: 'grid', texture_strength: 25 },
];
const PRIVATE_PAINT = ['#2a1b47', '#120e1f'];
const paintOf = (colors, angle) =>
  colors.length > 1 ? `linear-gradient(${angle}deg, ${colors.join(', ')})` : colors[0] || 'var(--bg)';
// Perceived brightness 0..1, to pick light or dark text over a custom background.
const brightness = hex => { const n = parseInt(hex.slice(1), 16); return (.299 * (n >> 16) + .587 * (n >> 8 & 255) + .114 * (n & 255)) / 255; };

function applyLook() {
  const a = cfg.appearance, l = cfg.layout;
  const colors = S.private ? PRIVATE_PAINT : a.background;
  const tone = colors.length
    ? (colors.reduce((sum, c) => sum + brightness(c), 0) / colors.length > .55 ? 'light' : 'dark')
    : a.theme === 'system' ? (dark.matches ? 'dark' : 'light') : a.theme;
  root.dataset.theme = tone;
  root.dataset.mode = l.mode;
  root.dataset.side = l.mode.startsWith('top') ? 'top' : l.mode.split('-')[1];
  const [tex, scale, blend] = TEXTURES[a.texture] || TEXTURES.none;
  const css = { '--accent': a.accent, '--radius': a.radius + 'px', '--font': a.font_size + 'px',
    '--side-w': l.sidebar_width + 'px', '--paint': paintOf(colors, a.gradient_angle),
    '--tex': tex, '--tex-op': scale * a.texture_strength / 100, '--tex-blend': blend };
  for (const k in css) root.style.setProperty(k, css[k]);
  $('#user-css').textContent = a.custom_css;
}

// ---------- the bar ----------
const hostOf = url => { try { return new URL(url).host; } catch { return ''; } };

function renderBar() {
  const wsBox = $('#ws'), adding = wsBox.classList.contains('adding');
  if (!adding) {
    wsBox.replaceChildren(...cfg.workspaces.map(w => {
      const chip = el('button', { className: 'ws' + (w.id === S.workspace ? ' active' : ''), title: w.name },
        el('i'), el('span', { textContent: w.name }));
      chip.style.setProperty('--c', w.color);
      chip.onclick = () => post({ cmd: 'select_workspace', id: w.id });
      return chip;
    }),
    el('button', { id: 'ws-add', textContent: '+', title: 'New workspace', ariaLabel: 'New workspace', onclick: startAddWorkspace }),
    el('input', { id: 'ws-name', type: 'text', placeholder: 'Workspace name', ariaLabel: 'New workspace name', onkeydown: onWorkspaceName, onblur: stopAddWorkspace }));
  }

  $('#tabs').replaceChildren(...S.tabs.map(t => {
    const close = el('button', { textContent: '×', title: 'Close tab', ariaLabel: 'Close tab' });
    close.onclick = e => { e.stopPropagation(); post({ cmd: 'close_tab', id: t.id }); };
    const name = t.title || hostOf(t.url) || 'New Tab';
    const tab = el('div', { className: 'tab' + (t.id === S.active ? ' active' : '') + (t.private ? ' private' : ''), title: name },
      el('span', { textContent: name }), close);
    tab.onclick = () => post({ cmd: 'select_tab', id: t.id });
    tab.onauxclick = e => { if (e.button === 1) post({ cmd: 'close_tab', id: t.id }); };
    return tab;
  }), el('button', { id: 'new', title: 'New tab', ariaLabel: 'New tab', onclick: () => act('new_tab') },
    el('b', { textContent: '+' }), el('span', { textContent: 'New tab' })));

  const cur = S.tabs.find(t => t.id === S.active);
  const key = cur ? cur.id + '|' + cur.url : '';
  if (key !== shown) { shown = key; $('#url').value = !cur || cur.url === 'about:blank' ? '' : cur.url; }
  $('#progress').classList.toggle('on', !!cur && cur.loading);
  $('#shield').classList.toggle('on', cfg.adblock.enabled);
  $('#shield').title = 'Ad blocking is ' + (cfg.adblock.enabled ? 'on' : 'off');
  const side = root.dataset.side;
  $('#collapse').title = S.peek ? 'Keep the bar open' : 'Collapse the bar';
  $('#collapse-line').setAttribute('d', side === 'top' ? 'M1.5 6.5h13' : side === 'left' ? 'M5.5 2.5v11' : 'M10.5 2.5v11');
}

const WS_COLORS = ['#6c8cff', '#f2994a', '#27ae60', '#eb5757', '#9b51e0', '#2d9cdb', '#e0b400'];
function addWorkspace(name) {
  const id = Math.max(0, ...cfg.workspaces.map(w => w.id)) + 1;
  cfg.workspaces.push({ id, name: name || 'Workspace ' + id, color: WS_COLORS[cfg.workspaces.length % WS_COLORS.length] });
  save();
  return id;
}
function startAddWorkspace() { $('#ws').classList.add('adding'); $('#ws-name').focus(); }
function stopAddWorkspace() { $('#ws').classList.remove('adding'); renderBar(); dropPeekSoon(); }
function onWorkspaceName(e) {
  if (e.key === 'Escape') return e.target.blur();
  if (e.key !== 'Enter' || !e.target.value.trim()) return;
  const id = addWorkspace(e.target.value.trim());
  e.target.blur();
  post({ cmd: 'select_workspace', id });
}

// ---------- settings ----------
function renderSettings() {
  for (const f of document.querySelectorAll('[data-k]')) {
    if (f === document.activeElement) continue;
    const v = get(cfg, f.dataset.k);
    if (f.type === 'checkbox') f.checked = v; else f.value = Array.isArray(v) ? v.join('\n') : v;
  }
  for (const b of $('#modes').children) b.classList.toggle('on', b.dataset.mode === cfg.layout.mode);

  const a = cfg.appearance;
  $('#presets').replaceChildren(...PRESETS.map(p => {
    const b = el('button', { className: 'preset', title: p.name, ariaLabel: p.name + ' theme' });
    b.style.background = p.background.length ? paintOf(p.background, a.gradient_angle) : 'linear-gradient(135deg, #ececf0 50%, #1b1b1f 50%)';
    b.onclick = () => { Object.assign(a, { background: [...p.background], accent: p.accent, texture: p.texture, texture_strength: p.texture_strength }); applyLook(); save(); };
    return b;
  }));

  if (!$('#bg-colors').contains(document.activeElement)) {
    $('#bg-colors').replaceChildren(...a.background.map((c, i) => {
      const input = el('input', { type: 'color', value: c, ariaLabel: 'Background color ' + (i + 1) });
      input.oninput = () => { a.background[i] = input.value; applyLook(); };
      input.onchange = save;
      const remove = el('button', { textContent: '×', title: 'Remove color', ariaLabel: 'Remove color', onclick: () => { a.background.splice(i, 1); applyLook(); save(); } });
      return el('span', { className: 'swatch' }, input, remove);
    }), ...(a.background.length < 3 ? [el('button', { className: 'btn', textContent: 'Add color',
      onclick: () => { a.background.push(a.background.at(-1) || a.accent); applyLook(); save(); } })] : []));
  }

  if (!$('#ws-list').contains(document.activeElement)) {
    $('#ws-list').replaceChildren(...cfg.workspaces.map((w, i) => {
      const color = el('input', { type: 'color', value: w.color, ariaLabel: 'Workspace color', onchange: () => { w.color = color.value; save(); } });
      const name = el('input', { type: 'text', value: w.name, ariaLabel: 'Workspace name', onchange: () => { w.name = name.value; save(); } });
      const remove = el('button', { className: 'btn', textContent: 'Delete', disabled: cfg.workspaces.length < 2,
        title: 'Its tabs move to the first workspace', onclick: () => { cfg.workspaces.splice(i, 1); save(); } });
      return el('div', { className: 'row' }, el('div', { className: 'wsrow' }, color, name), remove);
    }));
  }
  if (!window.__wispRecording) renderHotkeys();
}

const pretty = combo => combo.split('+').map(p =>
  p === 'Mod' ? (S.mac ? '⌘' : 'Ctrl') : p.replace(/^Bracket(Left|Right)$/, (_, s) => s === 'Left' ? '[' : ']')
    .replace('Equal', '=').replace('Minus', '-').replace('Comma', ',').replace(/^Arrow/, '')).join(' + ');

function renderHotkeys() {
  $('#hotkeys').replaceChildren(...Object.entries(cfg.hotkeys).map(([action, combo]) => {
    const b = el('button', { className: 'key', textContent: pretty(combo), title: 'Click, then press the new keys' });
    b.onclick = () => record(action, b);
    const name = action.replace(/_/g, ' ').replace(/^./, c => c.toUpperCase())
      .replace('Focus url', 'Focus address bar').replace('Toggle bar', 'Collapse or show the bar');
    return el('div', { className: 'row' }, name, b);
  }));
}

function record(action, button) {
  window.__wispRecording = true;
  button.classList.add('rec');
  button.textContent = 'Press keys… (Esc cancels)';
  const stop = () => { removeEventListener('keydown', onKey, true); window.__wispRecording = false; renderHotkeys(); };
  const onKey = e => {
    e.preventDefault(); e.stopImmediatePropagation();
    if (e.key === 'Escape') return stop();
    const combo = window.__wispCombo(e);
    if (!combo) return; // modifier alone: keep waiting
    const clash = Object.keys(cfg.hotkeys).find(a => a !== action && cfg.hotkeys[a] === combo);
    if (clash) cfg.hotkeys[clash] = cfg.hotkeys[action]; // swap instead of leaving a duplicate
    cfg.hotkeys[action] = combo;
    stop(); save();
  };
  addEventListener('keydown', onKey, true);
}

function render() {
  applyLook();
  for (const [attr, on] of Object.entries({ settings: S.settings, hidden: !S.shown, private: S.private, lights: S.lights }))
    root.toggleAttribute('data-' + attr, on);
  renderBar();
  if (S.settings) renderSettings();
}

// ---------- events ----------
document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => act(b.dataset.act));
$('#shield').onclick = () => { cfg.adblock.enabled = !cfg.adblock.enabled; save(); };
$('#reset-keys').onclick = () => { cfg.hotkeys = {}; save(); };
$('#ws-new').onclick = () => addWorkspace('');
$('#modes').onclick = e => { const b = e.target.closest('[data-mode]'); if (b) { cfg.layout.mode = b.dataset.mode; save(); } };

// Empty parts of the bar behave like a title bar: drag to move, double-click to expand.
$('#chrome').onmousedown = e => {
  if (e.button !== 0 || !e.target.matches('#chrome, #nav, #ws, #tabs, #actions, .spacer')) return;
  post({ cmd: e.detail === 2 ? 'maximize' : 'drag' });
};

$('#url').onkeydown = e => {
  if (e.key === 'Enter') post({ cmd: 'navigate', url: e.target.value });
  if (e.key === 'Escape') { shown = null; renderBar(); e.target.blur(); }
};
$('#url').onfocus = e => e.target.select();
$('#url').onblur = dropPeekSoon;

// Collapsed bar: show it while the mouse is over it (or on click), hide again after it leaves.
function dropPeekSoon() {
  clearTimeout(leaveTimer);
  leaveTimer = setTimeout(() => {
    const busy = hovering || S.settings || document.activeElement.matches('#url, #ws-name');
    if (S && S.peek && !busy) post({ cmd: 'peek', on: false });
  }, 350);
}
root.addEventListener('mouseenter', () => {
  hovering = true; clearTimeout(leaveTimer);
  if (S && !S.shown && cfg.layout.hover_expand) post({ cmd: 'peek', on: true });
});
root.addEventListener('mouseleave', () => { hovering = false; dropPeekSoon(); });
document.body.addEventListener('click', () => { if (S && !S.shown) post({ cmd: 'peek', on: true }); });

function onField(e) {
  const f = e.target, k = f.dataset.k;
  if (!k || !cfg) return;
  let v = f.type === 'checkbox' ? f.checked : f.type === 'number' || f.type === 'range' ? Number(f.value) : f.value;
  if (k === 'adblock.extra_hosts') v = v.split('\n').map(s => s.trim()).filter(Boolean);
  set(cfg, k, v);
  if (e.type === 'input') applyLook(); else save();
}
$('#settings').addEventListener('input', onField);   // live preview
$('#settings').addEventListener('change', onField);  // persist

addEventListener('keydown', e => {
  if (e.key === 'Escape' && S && S.settings && !window.__wispRecording && !e.target.closest('input, textarea, select')) act('settings');
});
dark.addEventListener('change', () => cfg && applyLook());
addEventListener('contextmenu', e => { if (!e.target.matches('input, textarea')) e.preventDefault(); });
post({ cmd: 'ready' });
</script>
</body>
</html>
