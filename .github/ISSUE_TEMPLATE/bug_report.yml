name: Bug report
description: Something in Wisp does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems should not be reported here. Use
        [private vulnerability reporting](https://github.com/Siimas/wisp-browser/security/advisories/new).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Wisp version
      description: Shown in Settings > About.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - macOS, Apple Silicon
        - macOS, Intel
        - Windows 11
        - Windows 10
        - Other (built from source)
    validations:
      required: true
  - type: input
    id: system-version
    attributes:
      label: System version
      placeholder: "macOS 15.1, or Windows 11 24H2"
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: >
        Screenshots, the address of the page if it only happens on one site, or
        your config.json with anything personal removed.
