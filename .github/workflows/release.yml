name: Release

# A release is published when the version in Cargo.toml changes on main.
#
# Every push to main runs the small "version" job. If no tag exists yet for the
# version in Cargo.toml, the installers are built and a GitHub release (and its tag)
# is created; otherwise nothing else happens. So merging a pull request that bumps
# the version is the one deliberate act that ships, and ordinary merges ship nothing.
#
# Automatic updates: when the repository has the update signing key configured
#   - secret   WISP_UPDATE_PRIVATE_KEY (and WISP_UPDATE_PRIVATE_KEY_PASSWORD)
#   - variable WISP_UPDATE_PUBKEY
# the app is built with the public key, the update files are signed, and latest.json
# is published so installed copies update themselves. Without the key the release is
# built without automatic updates.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Two merges in quick succession must not race to create the same release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Is there a new version?
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.read.outputs.tag }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already released: nothing to do."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "$tag has not been released yet: building it."
          fi

  build:
    name: ${{ matrix.name }}
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS Apple Silicon, os: macos-latest, target: aarch64-apple-darwin, arch: aarch64, formats: "app,dmg" }
          - { name: macOS Intel, os: macos-latest, target: x86_64-apple-darwin, arch: x64, formats: "app,dmg" }
          - { name: Windows x64, os: windows-latest, target: x86_64-pc-windows-msvc, arch: x64, formats: "nsis" }
    env:
      TAG: ${{ needs.version.outputs.tag }}
      WISP_UPDATE_PUBKEY: ${{ vars.WISP_UPDATE_PUBKEY }}
      SIGN_UPDATES: ${{ secrets.WISP_UPDATE_PRIVATE_KEY != '' && vars.WISP_UPDATE_PUBKEY != '' }}
      PACKAGE: cargo packager --release --formats ${{ matrix.formats }} --target ${{ matrix.target }} --binaries-dir target/${{ matrix.target }}/release --out-dir dist
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo install cargo-packager --locked --version 0.11.8
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package and sign update files
        if: env.SIGN_UPDATES == 'true'
        shell: bash
        run: $PACKAGE
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.WISP_UPDATE_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.WISP_UPDATE_PRIVATE_KEY_PASSWORD }}
      - name: Package (no update signing key configured)
        if: env.SIGN_UPDATES != 'true'
        shell: bash
        run: $PACKAGE
      - name: Name the macOS update archive after its version and architecture
        if: runner.os == 'macOS' && env.SIGN_UPDATES == 'true'
        run: |
          mv dist/Wisp.app.tar.gz "dist/Wisp_${TAG#v}_${{ matrix.arch }}.app.tar.gz"
          mv dist/Wisp.app.tar.gz.sig "dist/Wisp_${TAG#v}_${{ matrix.arch }}.app.tar.gz.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.app.tar.gz
            dist/*.sig
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: python3 .github/latest-json.py dist "$TAG" "$GITHUB_REPOSITORY"
      # Creating the release also creates the tag, at the commit that was built.
      - run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Wisp $TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
