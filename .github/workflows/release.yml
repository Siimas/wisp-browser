name: Release

# Push a tag like v0.2.0 (matching the version in Cargo.toml) to build installers
# and publish them as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS Apple Silicon, os: macos-latest, target: aarch64-apple-darwin, format: dmg }
          - { name: macOS Intel, os: macos-latest, target: x86_64-apple-darwin, format: dmg }
          - { name: Windows x64, os: windows-latest, target: x86_64-pc-windows-msvc, format: nsis }
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo install cargo-packager --locked --version 0.11.8
      - run: cargo build --release --target ${{ matrix.target }}
      - run: cargo packager --release --formats ${{ matrix.format }} --target ${{ matrix.target }} --binaries-dir target/${{ matrix.target }}/release --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Wisp $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
