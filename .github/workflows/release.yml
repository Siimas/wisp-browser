name: Release

# A release is published when the version in Cargo.toml changes on main.
#
# Every push to main runs the small "version" job. If no tag exists yet for the
# version in Cargo.toml, the installers are built and a GitHub release (and its tag)
# is created; otherwise nothing else happens. So merging a pull request that bumps
# the version is the one deliberate act that ships, and ordinary merges ship nothing.
#
# Automatic updates: when the repository has the update signing key configured
#   - secret   WISP_UPDATE_PRIVATE_KEY (and WISP_UPDATE_PRIVATE_KEY_PASSWORD)
#   - variable WISP_UPDATE_PUBKEY
# the app is built with the public key, the update files are signed, and latest.json
# is published so installed copies update themselves. Without the key the release is
# built without automatic updates.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; only the publishing job may write (create the release and tag).
permissions:
  contents: read

# Two merges in quick succession must not race to create the same release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Is there a new version?
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.read.outputs.tag }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          # The version names the tag and the update files: accept nothing but a plain one.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Cargo.toml version '$version' is not of the form 1.2.3" >&2
            exit 1
          fi
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Releases are only ever cut from main, even on a manual run.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Not on main ($GITHUB_REF): nothing is released from here."
            exit 0
          fi
          # ls-remote exits 0 when the tag exists and 2 when it does not; anything
          # else is a failed lookup, which must not be read as "not released yet".
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null
          found=$?
          set -e
          case "$found" in
            0) echo "release=false" >> "$GITHUB_OUTPUT"; echo "$tag is already released: nothing to do." ;;
            2) echo "release=true" >> "$GITHUB_OUTPUT"; echo "$tag has not been released yet: building it." ;;
            *) echo "could not look up $tag (git ls-remote exited $found)" >&2; exit 1 ;;
          esac

  build:
    name: ${{ matrix.name }}
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS Apple Silicon, os: macos-latest, target: aarch64-apple-darwin, arch: aarch64, formats: "app,dmg" }
          - { name: macOS Intel, os: macos-latest, target: x86_64-apple-darwin, arch: x64, formats: "app,dmg" }
          - { name: Windows x64, os: windows-latest, target: x86_64-pc-windows-msvc, arch: x64, formats: "nsis" }
    env:
      TAG: ${{ needs.version.outputs.tag }}
      WISP_UPDATE_PUBKEY: ${{ vars.WISP_UPDATE_PUBKEY }}
      SIGN_UPDATES: ${{ secrets.WISP_UPDATE_PRIVATE_KEY != '' && vars.WISP_UPDATE_PUBKEY != '' }}
      PACKAGE: cargo packager --release --formats ${{ matrix.formats }} --target ${{ matrix.target }} --binaries-dir target/${{ matrix.target }}/release --out-dir dist
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo install cargo-packager --locked --version 0.11.8
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package and sign update files
        if: env.SIGN_UPDATES == 'true'
        shell: bash
        run: $PACKAGE
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.WISP_UPDATE_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.WISP_UPDATE_PRIVATE_KEY_PASSWORD }}
      - name: Package (no update signing key configured)
        if: env.SIGN_UPDATES != 'true'
        shell: bash
        run: $PACKAGE
      # People read these names on the release page: say the system in plain words.
      # The .dmg and Setup.exe are what a person downloads; the .update.tar.gz files
      # and the .sig files are what installed copies fetch to update themselves.
      - name: Give the files clear names
        shell: bash
        run: |
          cd dist
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) name="Wisp-${TAG#v}-macOS-Apple-Silicon" ;;
            x86_64-apple-darwin) name="Wisp-${TAG#v}-macOS-Intel" ;;
            x86_64-pc-windows-msvc) name="Wisp-${TAG#v}-Windows-x64" ;;
          esac
          if [ "$RUNNER_OS" = "macOS" ]; then
            mv ./*.dmg "$name.dmg"
            rm -f ./*.dmg.sig   # nothing reads a signature for the disk image
            if [ -f Wisp.app.tar.gz ]; then
              mv Wisp.app.tar.gz "$name.update.tar.gz"
              mv Wisp.app.tar.gz.sig "$name.update.tar.gz.sig"
            fi
          else
            if ls ./*-setup.exe.sig > /dev/null 2>&1; then mv ./*-setup.exe.sig "$name-Setup.exe.sig"; fi
            mv ./*-setup.exe "$name-Setup.exe"
          fi
          ls -l
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.update.tar.gz
            dist/*.sig
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: python3 .github/latest-json.py dist "$TAG" "$GITHUB_REPOSITORY"
      # Creating the release also creates the tag, at the commit that was built.
      # (It refuses to run if a release for this tag already exists.)
      - name: Say which file is for whom
        run: |
          v="${TAG#v}"
          {
            echo "## Download"
            echo
            echo "| Your computer | File |"
            echo "| --- | --- |"
            echo "| Mac with Apple Silicon (M1 or later) | \`Wisp-$v-macOS-Apple-Silicon.dmg\` |"
            echo "| Mac with an Intel processor | \`Wisp-$v-macOS-Intel.dmg\` |"
            echo "| Windows 10 or 11 | \`Wisp-$v-Windows-x64-Setup.exe\` |"
            echo
            echo "The other files (\`.update.tar.gz\`, \`.sig\`, \`latest.json\`) are what installed copies use to update themselves. You do not need to download them."
            echo
          } > notes.md
      - run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Wisp $TAG" --notes-file notes.md --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
