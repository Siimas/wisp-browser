<!doctype html><meta charset="utf-8"><title>Test login</title>
<body style="font:16px system-ui;margin:40px;background:#f4f4f6">
<h1>Test login page</h1>
<form action="/done" method="post" style="display:grid;gap:10px;width:320px">
<label>Email <input type="email" name="email" id="email" autocomplete="username" autofocus></label>
<label>Password <input type="password" name="password" id="password" autocomplete="current-password"></label>
<button type="submit">Sign in</button></form></body>
