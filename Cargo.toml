[package]
name = "wisp"
version = "0.3.0"
edition = "2024"
description = "A fast, lightweight, customizable web browser"
license = "MIT"
repository = "https://github.com/Siimas/wisp-browser"
homepage = "https://github.com/Siimas/wisp-browser"
readme = "README.md"
keywords = ["browser", "webview", "wry", "adblock", "desktop"]
categories = ["web-programming", "gui"]
authors = ["Siimas"]

[dependencies]
# System TLS (no bundled crypto library): smaller, and nothing to compile in C.
cargo-packager-updater = { version = "0.2.3", default-features = false, features = ["native-tls"] }
# Already built in for the updater (same version and features): fetches filter lists.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37.2"
wry = "0.57.2"

# Versions below must match the ones wry itself depends on.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21.2", default-features = false }
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSURL", "NSGeometry", "NSArray"] }
objc2-web-kit = { version = "0.3", features = [
    "WKContentRuleList",
    "WKContentRuleListStore",
    "WKUserContentController",
    "block2",
] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.packager]
product-name = "Wisp"
identifier = "io.github.siimas.wisp"
category = "Productivity"
icons = ["assets/icon.icns", "assets/icon.ico", "assets/icon.png"]
# Shown by the installers and by the system: "Publisher" under Windows' Installed
# apps (without this it would be taken from the identifier and read "github"),
# the copyright line in the macOS Get Info window.
publisher = "Siimas"
copyright = "Copyright (c) 2026 Siimas"
homepage = "https://github.com/Siimas/wisp-browser"
description = "A fast, lightweight, customizable web browser"
# The Windows installer shows this text on its license page.
license-file = "LICENSE"

[package.metadata.packager.nsis]
# The Windows uninstaller offers a checkbox, off by default, to also delete these:
# settings and session, and the web engine's data (cookies, cache, site storage),
# which WebView2 keeps in a folder beside the program.
appdata-paths = ['$APPDATA\$PRODUCTNAME', '$INSTDIR\wisp.exe.WebView2']
