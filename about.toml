# Configuration for cargo-about, which writes THIRD-PARTY-NOTICES.
# Regenerate after any dependency change (CI fails if the file is stale):
#
#   cargo install cargo-about --locked --version 0.9.3 --features cli
#   cargo about generate --locked --fail about.hbs -o THIRD-PARTY-NOTICES
#
# A crate whose license is not listed below makes the command fail, so a new
# kind of license is always looked at by a person before it ships.

# Only what is compiled into the installers we publish.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]
